<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JD Infra Farms</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>JD Infra Farms</h1>
    <p>Best Investment Opportunity in Dholera Smart City</p>
</header>

<section class="services">
    <h2>Our Services</h2>

    <div class="service-card">
        <h3>Premium Farm Land</h3>
        <p>Government Approved Farm Land Near Dholera.</p>

        <a href="farm-details.html" class="btn">
            Get Start
        </a>
    </div>
</section>

<section class="feedback-section">

    <h2>Customer Feedback</h2>

    <form id="feedbackForm">

        <input type="text" id="name" placeholder="Your Name" required>

        <textarea id="message"
        placeholder="Write Your Feedback"
        required></textarea>

        <button type="submit">Submit</button>

    </form>

    <div id="feedbackList"></div>

</section>

<script>

let form=document.getElementById("feedbackForm");
let list=document.getElementById("feedbackList");

form.addEventListener("submit",function(e){

e.preventDefault();

let name=document.getElementById("name").value;
let message=document.getElementById("message").value;

let feedback=document.createElement("div");
feedback.classList.add("feedback-card");

feedback.innerHTML=`
<h3>${name}</h3>
<p>${message}</p>
`;

list.prepend(feedback);

form.reset();

});

</script>

<!-- NAVBAR -->
<div class="navbar">

    <!-- LOGO -->
    <div class="logo">
        JD Infra
    </div>

    <!-- MENU -->
    <div class="nav-links" id="menu">
        <a href="loging page.html">Loging page</a>

    </div>

<!-- MAIN LOGO -->
<div class="main-logo">

    <img src="55.png" alt="JD Infra Logo">

</div>

</body>
</html>
